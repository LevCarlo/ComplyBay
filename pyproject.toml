[build-system]
requires = ["setuptools<60", "wheel", "numpy", "cython"]
build-backend = "setuptools.build_meta"

[project]
name = "ComplyBay"
version = "0.1.0"
description = "Bayesian MCMC inversion toolkit for seafloor compliance"
authors = [{ name = "Mengjie Zheng", email = "mengjie.zheng@utoronto.ca" }]
license = "MIT"
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "bayesbay"
]

[project.optional-dependencies]
dev = ["pytest", "black"]