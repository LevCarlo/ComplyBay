site_name: ComplyBay
site_description: Forward modelling and Bayesian inversion for ocean-bottom seismology
repo_url: https://github.com/LevCarlo/ComplyBay
repo_name: LevCarlo/ComplyBay
edit_uri: edit/dev/docs/

nav:
  - Home: index.md
  - Running an inversion: workflow.md
  - Forward solvers: forward.md
  - Model parameterization: parameterization.md
  - Likelihood and posterior: inference.md
  - Synthetic tests: synthetic_tests.md
  - Development guide: development.md
  - API reference:
      - Model: api/model.md
      - Forward solvers: api/forward.md
      - ACF processing: api/acf.md
      - Parameterization: api/parameterization.md
      - Inference: api/inference.md
      - Workflow: api/workflow.md
      - IO: api/io.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: true
            heading_level: 2
            members_order: source
            filters: ["!^_"]
            show_source: true
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true

validation:
  links:
    not_found: warn
    anchors: warn
